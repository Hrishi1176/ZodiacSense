<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#05051a"/>
    </radialGradient>
    <linearGradient id="orb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="45%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background Container -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <!-- Cosmic Saturn Ring -->
  <ellipse cx="32" cy="32" rx="24" ry="8" fill="none" stroke="url(#ring)" stroke-width="3.5" transform="rotate(-25 32 32)" opacity="0.95" filter="url(#glow)"/>
  <!-- Central Glowing Logo Orb -->
  <circle cx="32" cy="32" r="13" fill="url(#orb)" filter="url(#glow)"/>
  <!-- Specular Reflection Highlight -->
  <circle cx="27" cy="27" r="3.5" fill="#ffffff" opacity="0.85"/>
</svg>
